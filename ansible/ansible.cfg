[defaults]
# Pas d'inventaire ni de mot de passe de vault par défaut : chaque
# déploiement nomme son environnement (cf. DEPLOYMENT.md), ex.
#   ansible-playbook -i inventories/recette --vault-id recette@.vault_pass_recette playbooks/deploy.yml
host_key_checking = False
retry_files_enabled = False
timeout = 1200



[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
ssh_args = -o ServerAliveInterval=5
