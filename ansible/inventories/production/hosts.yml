---
# Serveur de production (branche main). Le déploiement se fait depuis une
# session déjà connectée en SSH sur ce serveur (cf. DEPLOYMENT.md) : Ansible
# tourne donc en local sur cette machine, pas de saut SSH à configurer ici.
# Format YAML : un dossier passé en -i ignore les fichiers .ini.
production:
  hosts:
    localhost:
      ansible_connection: local
