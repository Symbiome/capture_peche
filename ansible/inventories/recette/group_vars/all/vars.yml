---
# Variables non secrètes du déploiement de recette. Les secrets vont dans
# vault.yml (chiffré), jamais ici — ce fichier est en clair dans git.
#
# Surchargeable en ligne de commande, ex. :
#   ansible-playbook -i inventories/recette --vault-id recette@.vault_pass_recette \
#     playbooks/deploy.yml --extra-vars "force_rebuild=true"
force_rebuild: false

# --- Environnement -----------------------------------------------------------
# Branche attendue sur le serveur : le playbook s'arrête si une autre est
# extraite (cf. DEPLOYMENT.md, « Mettre à jour le code »).
git_branch: develop
# Mention affichée dans le titre et le menu des fronts (VITE__ENV_NAME).
env_name: recette
# Profils docker compose actifs (COMPOSE_PROFILES) : « recette » démarre Maildev.
compose_profiles: recette

# --- Domaines --------------------------------------------------------------
# Adventiel gère le reverse proxy et le mapping domaine -> port host : ces
# valeurs doivent correspondre exactement à ce mapping (à leur demander avant
# le premier déploiement). Rien ici n'installe ni ne configure de proxy.
app_domain: peche-recette.carnet-peche.fr
api_domain: api-peche-recette.carnet-peche.fr
admin_domain: admin-peche-recette.carnet-peche.fr
dashboard_domain: dashboard-peche-recette.carnet-peche.fr
# mail_dev_domain: maildev.peche-recette.carnet-peche.fr

# --- Ports hôte --------------------------------------------------------------
# Doivent matcher le mapping port -> domaine côté reverse proxy Adventiel.
backend_port: 8080
mobile_port: 80
admin_port: 8000
dashboard_port: 8088
etl_port: 3000
# maildev_port: 1080

# --- Base de données ---------------------------------------------------------
postgres_db: fishola
# Image de base de docker/postgres/Dockerfile (#279) : Debian obligatoire
# (pgBackRest installé par apt, version épinglée pour Debian 13). Variante
# arm64 si besoin : imresamu/postgis:18-3.6 (Debian, multi-arch) — pas les
# variantes -alpine.
postgres_image: postgis/postgis:18-3.6

# --- Mail (recette : capturé par le Maildev embarqué, aucun vrai SMTP) -------
smtp_host: maildev
smtp_port: 1025
smtp_start_tls: DISABLED
smtp_ssl: false
smtp_username: ""
smtp_from: ""
# Destinataire des retours pêcheurs : valeur actuelle de l'application,
# capturée par Maildev en recette.
feedback_mail_to: fishola-lutins@list.forge.codelutin.com
