---
# Déploiement Fishola / capture_peche sur le serveur dev.
#
# Prérequis (voir DEPLOYMENT.md) : être déjà connecté en SSH sur le serveur
# cible, Docker + docker compose déjà installés. Le reverse proxy et le
# mapping domaine -> port sont gérés par Adventiel : ce playbook ne touche à
# aucun proxy, il se contente de builder les images et démarrer la stack sur
# les ports attendus (group_vars/dev/vars.yml).
#
# Secrets dans group_vars/dev/vault.yml (chiffré, voir DEPLOYMENT.md) — jamais
# dans un .env à copier à la main : ce playbook génère lui-même le .env
# consommé par docker compose.
#
# Rejouable sans risque (idempotent) : `mvn clean package` et
# `docker compose build/up` ne refont que ce qui a changé, sauf
# --extra-vars "force_rebuild=true". La stanza pgBackRest n'est créée qu'une
# fois et les tâches cron de sauvegarde sont identifiées par leur nom (#279).
#
# Usage :
#   cd ansible && ansible-playbook playbooks/deploy.yml

- name: Déployer Carnet-peche (dev)
  hosts: dev
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/../.."
    maven_image: maven:3.9-eclipse-temurin-25
    # pgBackRest tourne dans docker_pg (#279) ; -u postgres indispensable :
    # docker compose exec tourne en root par défaut.
    pg_exec: docker compose exec -T -u postgres docker_pg
    pgbackrest_log_file: "{{ lookup('env', 'HOME') }}/fishola-pgbackrest.log"
    # Commande des sauvegardes planifiées : chemins absolus et DOCKER_HOST
    # explicite (cron n'hérite ni du PATH ni de l'environnement de la session,
    # cas du Docker rootless).
    pgbackrest_cron_command: >-
      cd "{{ project_dir | realpath }}" &&
      DOCKER_HOST={{ _docker_host.stdout }}
      {{ _docker_bin.stdout }} compose exec -T -u postgres docker_pg
      pgbackrest --stanza=fishola

  tasks:
    - name: Vérifier la phrase de chiffrement des sauvegardes (vault)
      ansible.builtin.assert:
        that:
          - vault_pgbackrest_cipher_pass is defined
          - vault_pgbackrest_cipher_pass | length > 0
        fail_msg: >-
          vault_pgbackrest_cipher_pass manquant dans group_vars/dev/vault.yml
          (cf. DEPLOYMENT.md, « Sauvegardes ») : sans lui, docker compose
          refuse de démarrer docker_pg.
        quiet: true

    - name: Générer le fichier .env consommé par docker compose
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/dotenv.j2"
        dest: "{{ project_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Générer l'override Vite du front pêcheur (URL API publique)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/mobile-env-demo.local.j2"
        dest: "{{ project_dir }}/fishola-mobile/.env.demo.local"
        mode: "0644"

    - name: Générer l'override Vite du front admin (URL API publique)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/admin-env-demo.local.j2"
        dest: "{{ project_dir }}/fishola-admin/.env.demo.local"
        mode: "0644"

    - name: Déterminer le socket Docker de l'hôte (rootless ou non)
      # DOCKER_HOST, quand il est exporté (typique d'une install rootless :
      # /run/user/<uid>/docker.sock), prime sur le socket par défaut — même
      # résolution que celle utilisée par le CLI docker lui-même.
      ansible.builtin.command:
        cmd: /bin/sh -c 'echo "${DOCKER_HOST:-unix:///var/run/docker.sock}"'
      register: _docker_host
      changed_when: false

    - name: Construire le backend et les fronts (mvn clean package, profil demo)
      # jooq-codegen-maven (génération des classes jOOQ) lance un Postgres
      # éphémère via Testcontainers pour introspecter le schéma — une vraie
      # étape de build (generate-sources), pas un test, donc -DskipTests ne la
      # saute pas. Sans le socket Docker monté ici, Testcontainers ne trouve
      # aucun environnement Docker et le module fishola-backend échoue direct.
      # Le socket hôte (rootless ou non) est toujours monté sur le même
      # chemin interne fixe, et DOCKER_HOST pointé dessus explicitement : la
      # détection ci-dessus reste la seule chose à connaître de l'hôte.
      #
      # --network host : Testcontainers (Ryuk + le Postgres éphémère de jOOQ)
      # tourne en frère de ce conteneur de build, publié sur l'hôte à une
      # adresse de bridge (172.17.0.1:<port>) — pas forcément joignable depuis
      # ce conteneur selon la conf réseau. En partageant le netns de l'hôte,
      # cette adresse devient localhost:<port>, toujours joignable.
      ansible.builtin.command:
        cmd: >-
          docker run --rm --network host
          -v {{ project_dir }}:/workspace -w /workspace
          -v fishola_maven_repo:/root/.m2
          -v {{ _docker_host.stdout | regex_replace('^unix://', '') }}:/var/run/docker.sock
          -e DOCKER_HOST=unix:///var/run/docker.sock
          {{ maven_image }}
          mvn -B -DskipTests {{ '-U' if force_rebuild | default(false) else '' }} clean package
      changed_when: true

    - name: Construire les images Docker applicatives
      ansible.builtin.command:
        cmd: "docker compose build {{ '--no-cache' if force_rebuild | default(false) else '' }}"
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Démarrer la stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Attendre que docker_pg soit prêt
      # --wait limité à docker_pg (prérequis des étapes pgBackRest qui
      # suivent) : sur toute la stack, un conteneur annexe en mauvaise santé
      # (ex. maildev) ferait échouer le déploiement.
      ansible.builtin.command:
        cmd: docker compose up -d --wait docker_pg
        chdir: "{{ project_dir }}"
      changed_when: false

    - name: Vérifier si la stanza pgBackRest existe déjà
      ansible.builtin.command:
        cmd: "{{ pg_exec }} test -f /var/lib/pgbackrest/backup/fishola/backup.info"
        chdir: "{{ project_dir }}"
      register: _stanza_exists
      failed_when: false
      changed_when: false

    - name: Créer la stanza pgBackRest (premier déploiement)
      ansible.builtin.command:
        cmd: "{{ pg_exec }} pgbackrest --stanza=fishola stanza-create"
        chdir: "{{ project_dir }}"
      when: _stanza_exists.rc != 0
      changed_when: true

    - name: Remettre à zéro les compteurs d'archivage WAL (premier déploiement)
      # Avant stanza-create, chaque archive-push échoue et incrémente
      # pg_stat_archiver.failed_count, que health_check.sh exige à 0.
      ansible.builtin.command:
        cmd: "{{ pg_exec }} psql -At -c \"SELECT pg_stat_reset_shared('archiver')\""
        chdir: "{{ project_dir }}"
      when: _stanza_exists.rc != 0
      changed_when: true

    - name: Vérifier le dépôt et l'archivage des WAL (pgbackrest check)
      ansible.builtin.command:
        cmd: "{{ pg_exec }} pgbackrest --stanza=fishola check"
        chdir: "{{ project_dir }}"
      changed_when: false

    - name: Localiser le binaire docker (chemin absolu pour cron)
      ansible.builtin.command:
        cmd: /bin/sh -c 'command -v docker'
      register: _docker_bin
      changed_when: false

    - name: Planifier la sauvegarde complète (dimanche 3 h)
      ansible.builtin.cron:
        name: fishola - sauvegarde pgBackRest complète
        weekday: "0"
        hour: "3"
        minute: "0"
        job: "{{ pgbackrest_cron_command }} --type=full backup >> \"{{ pgbackrest_log_file }}\" 2>&1"

    - name: Planifier la sauvegarde différentielle (lundi à samedi 3 h)
      ansible.builtin.cron:
        name: fishola - sauvegarde pgBackRest différentielle
        weekday: "1-6"
        hour: "3"
        minute: "0"
        job: "{{ pgbackrest_cron_command }} --type=diff backup >> \"{{ pgbackrest_log_file }}\" 2>&1"

    - name: Récapitulatif du déploiement
      ansible.builtin.debug:
        msg:
          - "Déploiement terminé."
          - "Front pêcheur : {{ app_domain }} (port local {{ mobile_port }})"
          - "Front admin   : {{ admin_domain }} (port local {{ admin_port }})"
          - "API backend   : {{ api_domain }}/api/v1/status (port local {{ backend_port }})"
          - "Sauvegardes   : complète le dimanche, différentielle du lundi au samedi, à 3 h (journal : {{ pgbackrest_log_file }})"
          - "Vérifier que ce mapping domaine -> port correspond bien au reverse proxy Adventiel."
          - "Prochaine étape : ./health_check.sh --local puis ./health_check.sh"
