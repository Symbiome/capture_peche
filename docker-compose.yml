# Stack Fishola / capture_peche — serveurs de recette et de production : même
# fichier pour les deux, seules les variables du .env généré par Ansible
# changent (ansible/inventories/<env>, cf. DEPLOYMENT.md).
#
# Reconstruit les 3 images applicatives à partir des Dockerfile.demo déjà
# utilisés par la CI GitLab (mêmes artefacts, juste construits ici plutôt que
# poussés vers un registry).
# Déploiement complet (build Maven/npm inclus) orchestré par
# ansible/playbooks/deploy.yml — voir DEPLOYMENT.md.
#
# Toujours précédé d'un `mvn clean package` à la racine (produit
# fishola-backend/target/quarkus-app, fishola-mobile/target/dist-demo et
# fishola-admin/target/dist-demo, que les Dockerfile.demo se contentent de
# copier). Sans ce build, `docker compose build` échoue sur ces 3 services.

services:
  # Nommé docker_pg pour matcher l'hôte JDBC déjà codé en dur dans les profils
  # %dev/%demo de fishola-backend/src/main/resources/application.properties —
  # évite de surcharger QUARKUS_DATASOURCE_JDBC_URL.
  #
  # Sauvegardes (#279) : image PostGIS + pgBackRest (docker/postgres), WAL
  # archivés en continu dans le volume fishola_pgbackrest (restauration à un
  # instant donné). Les sauvegardes complètes/différentielles sont lancées par
  # le cron de l'hôte (ansible/playbooks/deploy.yml). archive_mode ne prend
  # effet qu'au redémarrage du conteneur.
  docker_pg:
    build:
      context: ./docker/postgres
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_command=pgbackrest --stanza=fishola archive-push %p
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fishola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?PGBACKREST_REPO1_CIPHER_PASS manquant dans .env}
    volumes:
      - fishola_pgdata:/var/lib/postgresql
      - fishola_pgbackrest:/var/lib/pgbackrest
      - ./docker/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fishola]

  fishola-backend:
    build:
      context: ./fishola-backend
      dockerfile: src/main/docker/Dockerfile.demo
    restart: unless-stopped
    depends_on:
      docker_pg:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      FISHOLA_JWT_SECRET: ${FISHOLA_JWT_SECRET:?FISHOLA_JWT_SECRET manquant dans .env}
      FISHOLA_ADMIN_PASSWORD: ${FISHOLA_ADMIN_PASSWORD:?FISHOLA_ADMIN_PASSWORD manquant dans .env}
      FISHOLA_BACKEND_BASE_URL: https://${API_DOMAIN}
      FISHOLA_SMTP_HOST: ${SMTP_HOST:-maildev}
      FISHOLA_SMTP_PORT: ${SMTP_PORT:-1025}
      QUARKUS_MAILER_HOST: ${SMTP_HOST:-maildev}
      QUARKUS_MAILER_PORT: ${SMTP_PORT:-1025}
      QUARKUS_MAILER_START_TLS: ${SMTP_START_TLS:-DISABLED}
      QUARKUS_MAILER_SSL: ${SMTP_SSL:-false}
      # Vides en recette (Maildev, sans authentification) : Quarkus les ignore.
      QUARKUS_MAILER_USERNAME: ${SMTP_USERNAME:-}
      QUARKUS_MAILER_PASSWORD: ${SMTP_PASSWORD:-}
      QUARKUS_MAILER_FROM: ${SMTP_FROM:-}
      FISHOLA_FEEDBACK_MAIL_TO: ${FEEDBACK_MAIL_TO:?FEEDBACK_MAIL_TO manquant dans .env}
      # Le profil %demo hérite sinon des origines localhost:808x du profil %dev :
      # sans ça, le navigateur bloque les appels API en CORS depuis les vrais domaines.
      QUARKUS_HTTP_CORS_ORIGINS: https://${APP_DOMAIN},https://${ADMIN_DOMAIN}
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    networks: [fishola]

  fishola-mobile:
    build:
      context: ./fishola-mobile
      dockerfile: docker/Dockerfile.demo
    restart: unless-stopped
    depends_on: [fishola-backend]
    ports:
      - "0.0.0.0:${MOBILE_PORT:-8081}:80"
    networks: [fishola]

  fishola-admin:
    build:
      context: ./fishola-admin
      dockerfile: docker/Dockerfile.demo
    restart: unless-stopped
    depends_on: [fishola-backend]
    ports:
      - "0.0.0.0:${ADMIN_PORT:-8082}:80"
    networks: [fishola]

  # Recette uniquement : COMPOSE_PROFILES=recette dans le .env. Absent en
  # production, où les mails partent par le vrai SMTP.
  maildev:
    image: maildev/maildev
    profiles: [recette]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILDEV_PORT:-41080}:1080"
    networks: [fishola]

volumes:
  fishola_pgdata:
  fishola_pgbackrest:

networks:
  fishola:
