# Configuration pgBackRest de la stack déployée (#279), montée en lecture
# seule dans docker_pg (/etc/pgbackrest/pgbackrest.conf).
#
# Aucun secret ici : la phrase de chiffrement du dépôt arrive par la variable
# d'environnement PGBACKREST_REPO1_CIPHER_PASS (.env généré par Ansible depuis
# le vault). Sans cette phrase, les sauvegardes sont illisibles : la conserver
# hors du serveur (cf. DEPLOYMENT.md).
#
# Rétention (cadrage §5.7, à confirmer avec Adventiel) : une complète par
# semaine gardée 180 jours, 26 différentielles (6 par semaine, ~1 mois).

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=180
repo1-retention-diff=26
start-fast=y
log-level-console=info

[fishola]
# Doit être exactement le data_directory de PostgreSQL (PGDATA de l'image 18).
pg1-path=/var/lib/postgresql/18/docker
